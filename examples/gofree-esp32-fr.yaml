# GoFree en français : mêmes entités, noms et réglages traduits.

esphome:
  name: gofree
  friendly_name: Surpresseur

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:

external_components:
  - source: github://tatutsa888/gofree@v1.0.0
    components: [gofree]

packages:
  gofree: github://tatutsa888/gofree/gofree.yaml@v1.0.0

